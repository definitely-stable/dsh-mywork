packages:
  - packages/*

# The controller and the web package declare `@deepseek-ai/dsh` as a peer so the
# platform's compatibility gate actually evaluates them
# (`packages/boot/app-boot/src/plugin-compatibility.ts` reads peerDependencies
# only). Auto-installing that peer would pull the whole DSH CLI into this
# workspace, and the lockfile would then depend on a registry the build does not
# need: the bundle is delivered as a tarball, and `scripts/verify-profile.mjs`
# proves it mounts. DSH writes the same setting into its own profiles
# (`packages/boot/app-boot/src/profile.ts`), so the delivery channel is
# unaffected. Without this, `pnpm install --frozen-lockfile` fails with
# ERR_PNPM_OUTDATED_LOCKFILE for a dependency that must never be installed.
autoInstallPeers: false
